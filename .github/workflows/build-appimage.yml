name: Native release guard

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit publication tree
        run: node scripts/audit-publication.mjs

      - name: Explain guarded binary packaging
        run: |
          echo "Binary upload is intentionally disabled."
          echo "See NATIVE-PACKAGING.md and RELEASE-CHECKLIST.md."
